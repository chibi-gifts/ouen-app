<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>応援アプリ</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(
      180deg,
      #080d2b 0%,
      #17134a 50%,
      #3a1765 100%
    );
    color: white;
    text-align: center;
    font-family: sans-serif;
  }

  .app {
    min-height: 100vh;
    padding: 40px 20px;
    box-sizing: border-box;
  }

  h1 {
    margin-top: 20px;
  }
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.stars span {
  position: absolute;
  color: #ffffff;
  text-shadow: 0 0 8px #ffffff, 0 0 16px #b8c7ff;
  animation: twinkle 2.5s infinite ease-in-out;
}

.stars span:nth-child(1) {
  top: 10%;
  left: 12%;
  font-size: 18px;
}

.stars span:nth-child(2) {
  top: 18%;
  left: 72%;
  font-size: 12px;
}

.stars span:nth-child(3) {
  top: 28%;
  left: 42%;
  font-size: 16px;
}

.stars span:nth-child(4) {
  top: 38%;
  left: 18%;
  font-size: 13px;
}

.stars span:nth-child(5) {
  top: 45%;
  left: 82%;
  font-size: 20px;
}

.stars span:nth-child(6) {
  top: 55%;
  left: 55%;
  font-size: 11px;
}

.stars span:nth-child(7) {
  top: 68%;
  left: 10%;
  font-size: 15px;
}

.stars span:nth-child(8) {
  top: 73%;
  left: 75%;
  font-size: 13px;
}

.stars span:nth-child(9) {
  top: 82%;
  left: 35%;
  font-size: 18px;
}

.stars span:nth-child(10) {
  top: 88%;
  left: 88%;
  font-size: 12px;
}

.stars span:nth-child(11) {
  top: 92%;
  left: 60%;
  font-size: 16px;
}

.stars span:nth-child(12) {
  top: 6%;
  left: 48%;
  font-size: 11px;
}

@keyframes twinkle {
  0%, 100% {
    opacity: 0.35;
    transform: scale(0.8);
  }

  50% {
    opacity: 1;
    transform: scale(1.2);
  }
}
.orb {
  width: min(72vw, 300px);
  height: auto;
  display: block;
  margin: 35px auto 25px;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 18px rgba(220, 200, 255, 0.75));
  animation: floatOrb 4s ease-in-out infinite;
}

@keyframes floatOrb {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}
.support-status {
  width: min(90%, 360px);
  margin: 10px auto 30px;
  padding: 18px 20px;
  box-sizing: border-box;

  background: rgba(255, 255, 255, 0.10);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 22px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow:
    0 0 20px rgba(180, 160, 255, 0.18),
    inset 0 0 20px rgba(255, 255, 255, 0.05);
}

.support-number {
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 1px;
}

.remaining-number {
  margin-top: 8px;
  font-size: 15px;
  opacity: 0.85;
}

.progress-bar {
  width: 100%;
  height: 10px;
  margin-top: 16px;
  overflow: hidden;

  background: rgba(255, 255, 255, 0.12);
  border-radius: 999px;
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: 999px;

  background: linear-gradient(
    90deg,
    #9e8cff,
    #e6c8ff,
    #fff2b8
  );

  box-shadow: 0 0 12px rgba(230, 200, 255, 0.8);
}
.quantity-box {
  width: min(90%, 360px);
  margin: 0 auto 25px;
  padding: 18px 20px;
  box-sizing: border-box;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 22px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.quantity-title {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: bold;
}

.quantity-control {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
}

.quantity-control button {
  width: 48px;
  height: 48px;

  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 50%;

  background: rgba(255, 255, 255, 0.12);
  color: white;

  font-size: 28px;
  line-height: 1;

  cursor: pointer;
}

.quantity-control button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

#quantity {
  min-width: 40px;
  font-size: 26px;
  font-weight: bold;
}

.quantity-price {
  margin: 12px 0 0;
  font-size: 14px;
  opacity: 0.8;
}
.name-box {
  width: min(90%, 360px);
  margin: 0 auto 25px;
  padding: 18px 20px;
  box-sizing: border-box;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 22px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.name-title {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: bold;
}

.name-input {
  width: 100%;
  padding: 13px 15px;
  box-sizing: border-box;

  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 14px;

  background: rgba(255, 255, 255, 0.10);
  color: white;

  font-size: 16px;
  outline: none;
}

.name-input::placeholder {
  color: rgba(255, 255, 255, 0.55);
}
  .reason-box {
  width: min(90%, 360px);
  margin: 0 auto 25px;
  padding: 18px 20px;
  box-sizing: border-box;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 22px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.reason-title {
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: bold;
}

.reason-options {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

.reason-option {
  padding: 10px 13px;

  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;

  background: rgba(255, 255, 255, 0.10);
  color: white;

  font-size: 13px;
  line-height: 1.4;

  cursor: pointer;
}

.reason-option.selected {
  background: rgba(210, 180, 255, 0.30);
  border-color: rgba(255, 235, 255, 0.75);
  box-shadow: 0 0 12px rgba(220, 190, 255, 0.45);
}
  .other-reason-box {
  display: none;
  margin-top: 12px;
}

.other-reason-box.show {
  display: block;
}
  .idea-box {
  width: min(90%, 360px);
  margin: 0 auto 25px;
  padding: 18px 20px;
  box-sizing: border-box;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 22px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.idea-title {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: bold;
}

.idea-input {
  width: 100%;
  min-height: 120px;
  padding: 13px 15px;
  box-sizing: border-box;

  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 14px;

  background: rgba(255, 255, 255, 0.10);
  color: white;

  font-size: 16px;
  line-height: 1.6;
  font-family: sans-serif;

  outline: none;
  resize: vertical;
}

.idea-input::placeholder {
  color: rgba(255, 255, 255, 0.55);
}
</style>
</head>

<body>
  <div class="app">
    <h1>🎁 応援アプリ</h1>

    <p>チームの隊長へ、応援を届けよう。</p>
<img
  src="sphere.png"
  alt="幻想的な応援の球体"
  class="orb"
>
 <div class="support-status">
  <div class="support-number">
    現在 <span id="current-count">0</span> / 100口
  </div>

  <div class="remaining-number">
    残り <span id="remaining-count">100</span>口
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>
  <div class="quantity-box">
  <p class="quantity-title">応援する口数</p>

  <div class="quantity-control">
    <button type="button" id="minus-btn">−</button>
    <span id="quantity">1</span>
    <button type="button" id="plus-btn">＋</button>
  </div>

<p class="quantity-price">
  応援金額：<span id="total-price">150</span>円
</p>
</div>
      <div class="name-box">
    <p class="name-title">お部屋で使用している名前</p>

    <input
      type="text"
      id="user-name"
      class="name-input"
      placeholder="お名前を入力してください"
      maxlength="20"
    >
  </div>
      <div class="reason-box">
    <p class="reason-title">応援する理由</p>

    <div class="reason-options">
      <button type="button" class="reason-option">
        いつもお世話になっているから
      </button>

      <button type="button" class="reason-option">
        AIを使って更にラクラク参加したいから
      </button>

      <button type="button" class="reason-option">
        企画を応援したいから
      </button>

      <button type="button" class="reason-option">
        みんなの負担を減らしたいから
      </button>

      <button type="button" class="reason-option">
        新しいことに挑戦するのを応援したいから
      </button>

      <button type="button" class="reason-option">
        その他
      </button>
      <div id="other-reason-box" class="other-reason-box">
  <input
    type="text"
    id="other-reason"
    class="name-input"
    placeholder="応援する理由を入力してください"
    maxlength="200"
  >
</div>
    </div>
  </div>

  <div class="idea-box">
    <p class="idea-title">💡 こんなアプリがあったら嬉しい！</p>

    <textarea
      id="app-idea"
      class="idea-input"
      maxlength="200"
placeholder="今後作ってほしいアプリのアイデアを書いてください&#10;（例：みんなでできる簡単なゲームがほしい！）"
    ></textarea>
  </div>
<button type="button" id="support-btn">
  ✨ 応援を届ける ✨
</button>
    <div id="confirm-screen" style="display: none;">
  <h2>✨ 応援内容の確認 ✨</h2>

  <p>お名前：<span id="confirm-name"></span></p>
  <p>応援口数：<span id="confirm-quantity"></span>口</p>
  <p>応援金額：<span id="confirm-price"></span>円</p>
  <p>応援する理由：<span id="confirm-reason"></span></p>
  <p>アプリのアイデア：<span id="confirm-idea"></span></p>

  <button type="button" id="back-btn">
    ← 戻って修正する
  </button>

  <button type="button" id="final-support-btn">
    ✨ この内容で応援する ✨
  </button>
</div>
  </div>
  <div id="complete-screen" style="display: none;">
  <h2>✨ 応援を届けました！ ✨</h2>
  <p>今回送った内容</p>
  <p>お名前：<span id="complete-name"></span></p>
  <p>応援口数：<span id="complete-quantity"></span>口</p>
  <p>応援金額：<span id="complete-price"></span>円</p>
  <p>応援する理由：<span id="complete-reason"></span></p>
  <p>アプリのアイデア：<span id="complete-idea"></span></p>
</div>
<div class="stars">
  <span>✦</span>
  <span>✧</span>
  <span>⋆</span>
  <span>✦</span>
  <span>✧</span>
  <span>⋆</span>
  <span>✦</span>
  <span>✧</span>
  <span>⋆</span>
  <span>✦</span>
  <span>✧</span>
  <span>⋆</span>
</div>
<script>
  const TOTAL_GOAL = 100;
  const PRICE_PER_UNIT = 150;

  let currentCount = 0;
  let quantity = 1;

  const currentCountElement = document.getElementById("current-count");
  const remainingCountElement = document.getElementById("remaining-count");
  const progressFillElement = document.getElementById("progress-fill");
  const quantityElement = document.getElementById("quantity");
  const totalPriceElement = document.getElementById("total-price");
  const minusButton = document.getElementById("minus-btn");
  const plusButton = document.getElementById("plus-btn");

  function updateSupportStatus() {
    const remaining = TOTAL_GOAL - currentCount;

    currentCountElement.textContent = currentCount;
    remainingCountElement.textContent = remaining;

    const progress = (currentCount / TOTAL_GOAL) * 100;
    progressFillElement.style.width = progress + "%";

    if (remaining <= 0) {
      quantity = 0;
    } else if (quantity > remaining) {
      quantity = remaining;
    }

    quantityElement.textContent = quantity;
    totalPriceElement.textContent = quantity * PRICE_PER_UNIT;
    minusButton.disabled = quantity <= 1;
    plusButton.disabled = quantity >= remaining;
  }

  minusButton.addEventListener("click", function () {
    if (quantity > 1) {
      quantity--;
      updateSupportStatus();
    }
  });

  plusButton.addEventListener("click", function () {
    const remaining = TOTAL_GOAL - currentCount;

    if (quantity < remaining) {
      quantity++;
      updateSupportStatus();
    }
  });

  updateSupportStatus();
  const reasonOptions = document.querySelectorAll(".reason-option");
const otherReasonBox = document.getElementById("other-reason-box");

reasonOptions.forEach(function (option) {
  option.addEventListener("click", function () {
    option.classList.toggle("selected");

    if (option.textContent.trim() === "その他") {
      if (option.classList.contains("selected")) {
        otherReasonBox.classList.add("show");
      } else {
        otherReasonBox.classList.remove("show");
      }
    }
  });
});
    const supportButton = document.getElementById("support-btn");
  const confirmScreen = document.getElementById("confirm-screen");

  const confirmName = document.getElementById("confirm-name");
  const confirmQuantity = document.getElementById("confirm-quantity");
  const confirmPrice = document.getElementById("confirm-price");
  const confirmReason = document.getElementById("confirm-reason");
  const confirmIdea = document.getElementById("confirm-idea");
const completeScreen = document.getElementById(“complete-screen”);
const completeName = document.getElementById(“complete-name”);
const completeQuantity = document.getElementById(“complete-quantity”);
const completePrice = document.getElementById(“complete-price”);
const completeReason = document.getElementById(“complete-reason”);
const completeIdea = document.getElementById(“complete-idea”);
  const backButton = document.getElementById("back-btn");

  supportButton.addEventListener("click", function () {
    const name = document.getElementById("user-name").value.trim();
    const idea = document.getElementById("app-idea").value.trim();

    const selectedReasons = Array.from(
      document.querySelectorAll(".reason-option.selected")
    ).map(function (option) {
      return option.textContent.trim();
    });

    const otherReason = document.getElementById("other-reason").value.trim();

    if (selectedReasons.includes("その他") && otherReason) {
      selectedReasons[selectedReasons.indexOf("その他")] =
        "その他：" + otherReason;
    }

    confirmName.textContent = name || "未入力";
    confirmQuantity.textContent = quantity;
    confirmPrice.textContent = quantity * PRICE_PER_UNIT;
    confirmReason.textContent =
      selectedReasons.length > 0 ? selectedReasons.join("、") : "未選択";
    confirmIdea.textContent = idea || "未入力";

    confirmScreen.style.display = "block";
    supportButton.style.display = "none";
  });

  backButton.addEventListener("click", function () {
    confirmScreen.style.display = "none";
    supportButton.style.display = "inline-block";
  });
    const finalSupportButton =
    document.getElementById("final-support-btn");

  const GAS_URL =
    "https://script.google.com/macros/s/AKfycbzv0v5llJDwFN8gCZ6b78LVdcrIsRBd100OpcIs_lYu-xkm4zb1FIl6dhF9JtDdRc5f/exec";

  finalSupportButton.addEventListener("click", function () {
    const name = document.getElementById("user-name").value.trim();
    const idea = document.getElementById("app-idea").value.trim();

    const selectedReasons = Array.from(
      document.querySelectorAll(".reason-option.selected")
    ).map(function (option) {
      return option.textContent.trim();
    });

    const otherReason =
      document.getElementById("other-reason").value.trim();

    const data = {
      name: name,
      quantity: quantity,
      amount: quantity * PRICE_PER_UNIT,
      reason: selectedReasons.join("、"),
      otherReason: otherReason,
      appIdea: idea
    };

    finalSupportButton.disabled = true;
    finalSupportButton.textContent = "送信中…";

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(data)
    })
  .then(function () {
completeName.textContent = name || “未入力”;
completeQuantity.textContent = quantity;
completePrice.textContent = quantity * PRICE_PER_UNIT;
completeReason.textContent =
selectedReasons.length > 0 ? selectedReasons.join(”、”) : “未選択”;
completeIdea.textContent = idea || “未入力”;

confirmScreen.style.display = “none”;
completeScreen.style.display = “block”;
})
      .catch(function (error) {
        console.error(error);
        alert("送信できませんでした。もう一度お試しください。");
        finalSupportButton.disabled = false;
        finalSupportButton.textContent =
          "✨ この内容で応援する ✨";
      });
  });
</script>
</body>
</html>
