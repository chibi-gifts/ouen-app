<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>応援アプリ</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(
      180deg,
      #080d2b 0%,
      #17134a 50%,
      #3a1765 100%
    );
    color: white;
    text-align: center;
    font-family: sans-serif;
  }

  .app {
    min-height: 100vh;
    padding: 40px 20px;
    box-sizing: border-box;
  }

  h1 {
    margin-top: 20px;
  }
.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.stars span {
  position: absolute;
  color: #ffffff;
  text-shadow: 0 0 8px #ffffff, 0 0 16px #b8c7ff;
  animation: twinkle 2.5s infinite ease-in-out;
}

.stars span:nth-child(1) {
  top: 10%;
  left: 12%;
  font-size: 18px;
}

.stars span:nth-child(2) {
  top: 18%;
  left: 72%;
  font-size: 12px;
}

.stars span:nth-child(3) {
  top: 28%;
  left: 42%;
  font-size: 16px;
}

.stars span:nth-child(4) {
  top: 38%;
  left: 18%;
  font-size: 13px;
}

.stars span:nth-child(5) {
  top: 45%;
  left: 82%;
  font-size: 20px;
}

.stars span:nth-child(6) {
  top: 55%;
  left: 55%;
  font-size: 11px;
}

.stars span:nth-child(7) {
  top: 68%;
  left: 10%;
  font-size: 15px;
}

.stars span:nth-child(8) {
  top: 73%;
  left: 75%;
  font-size: 13px;
}

.stars span:nth-child(9) {
  top: 82%;
  left: 35%;
  font-size: 18px;
}

.stars span:nth-child(10) {
  top: 88%;
  left: 88%;
  font-size: 12px;
}

.stars span:nth-child(11) {
  top: 92%;
  left: 60%;
  font-size: 16px;
}

.stars span:nth-child(12) {
  top: 6%;
  left: 48%;
  font-size: 11px;
}

@keyframes twinkle {
  0%, 100% {
    opacity: 0.35;
    transform: scale(0.8);
  }

  50% {
    opacity: 1;
    transform: scale(1.2);
  }
}
.orb {
  width: min(72vw, 300px);
  height: auto;
  display: block;
  margin: 35px auto 25px;
  position: relative;
  z-index: 2;
  filter: drop-shadow(0 0 18px rgba(220, 200, 255, 0.75));
  animation: floatOrb 4s ease-in-out infinite;
}

@keyframes floatOrb {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }
}
</style>
</head>

<body>
  <div class="app">
    <h1>🎁 応援アプリ</h1>

    <p>チームの隊長へ、応援を届けよう。</p>
<img
  src="sphere.png"
  alt="幻想的な応援の球体"
  class="orb"
>
    <p id="support-count">現在の応援口数 0</p>
  </div>
<div class="stars">
  <span>✦</span>
  <span>✧</span>
  <span>⋆</span>
  <span>✦</span>
  <span>✧</span>
  <span>⋆</span>
  <span>✦</span>
  <span>✧</span>
  <span>⋆</span>
  <span>✦</span>
  <span>✧</span>
  <span>⋆</span>
</div>
</body>
</html>
